name: Update watchlist

on:
  schedule:
    - cron: "7 * * * *"    # every hour (minute 7, avoids the busy top of the hour)
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-watchlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run screener
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python -u screener.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update watchlist data $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
